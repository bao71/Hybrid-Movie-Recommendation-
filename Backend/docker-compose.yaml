services:
  postgres:
    image: postgres:16
    container_name: movie_postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: movie_user
      POSTGRES_PASSWORD: movie_pass
      POSTGRES_DB: movie_recommender

    ports:
     - "5433:5432"

    volumes:
      - movie_pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U movie_user -d movie_recommender"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: movie_pgadmin
    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin123

    ports:
      - "5050:80"

    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      - movie_pgadmin_data:/var/lib/pgadmin

volumes:
  movie_pgdata:
  movie_pgadmin_data: